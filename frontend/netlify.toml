[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the BUSy Way backend on Render. Requests stay same-origin
# from the browser's point of view, so no CORS configuration is needed.
[[redirects]]
  from = "/api/*"
  to = "https://busyway-ifk2.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
